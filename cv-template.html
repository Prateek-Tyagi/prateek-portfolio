<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$name$ — CV</title>
    <meta name="description" content="Curriculum vitae of $name$, $role$." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        --ink: #202124;
        --muted: #55585c;
        --rule: #b9bdc1;
        --link: #245ea8;
        --paper: #fff;
        --canvas: #e8eaed;
        --body:
          Arial, "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont,
          sans-serif;
      }

      @page {
        size: A4;
        margin: 13mm 16mm;
      }

      * {
        box-sizing: border-box;
      }

      html {
        color: var(--ink);
        font-family: var(--body);
        font-size: 9pt;
        line-height: 1.3;
        -webkit-font-smoothing: antialiased;
      }

      body {
        margin: 0;
        background: var(--paper);
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      .screen-actions {
        display: none;
      }

      .sheet {
        width: 100%;
        max-width: 210mm;
        margin: 0 auto;
        background: var(--paper);
      }

      .name {
        margin: 0 0 1pt;
        font-size: 20pt;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0 0 3pt;
        color: var(--muted);
        font-size: 9.5pt;
        font-weight: 500;
      }

      .contact {
        margin: 0;
        color: var(--muted);
        font-size: 8.2pt;
        line-height: 1.45;
      }

      .contact .sep {
        margin: 0 3pt;
        color: #777;
      }

      .rule-top {
        display: none;
      }

      .sheet h2 {
        margin: 9pt 0 3.5pt;
        padding-bottom: 1.5pt;
        border-bottom: 0.7pt solid var(--rule);
        font-size: 9.2pt;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: 0.025em;
        text-transform: uppercase;
        break-after: avoid;
        page-break-after: avoid;
      }

      .sheet h3 {
        margin: 6.5pt 0 0;
        overflow: hidden;
        font-size: 10pt;
        font-weight: 700;
        line-height: 1.2;
        break-after: avoid;
        page-break-after: avoid;
      }

      .sheet h3 .when {
        float: right;
        margin-left: 10pt;
        color: var(--muted);
        font-size: 8.6pt;
        font-weight: 400;
        white-space: nowrap;
      }

      .sheet h3 + p {
        margin: 0.5pt 0 2pt;
        color: var(--muted);
        font-size: 8.5pt;
        font-style: italic;
        break-after: avoid;
        page-break-after: avoid;
      }

      .sheet h3 + p strong {
        color: var(--muted);
        font-weight: 600;
      }

      .sheet p {
        margin: 1.7pt 0;
        font-size: 8.8pt;
      }

      .sheet h2 + p,
      .sheet h2 ~ p {
        orphans: 2;
        widows: 2;
      }

      .sheet h2 + p strong,
      .sheet h2 ~ p > strong:first-child {
        font-weight: 700;
      }

      .sheet ul {
        margin: 1.5pt 0 3.5pt;
        padding-left: 12pt;
      }

      .sheet li {
        margin: 0 0 1.4pt;
        padding-left: 0.5pt;
        font-size: 8.75pt;
        orphans: 2;
        widows: 2;
      }

      .sheet li::marker {
        font-size: 0.8em;
      }

      .sheet strong {
        font-weight: 700;
      }

      .page-break {
        break-before: page;
        page-break-before: always;
        height: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      @media screen {
        html {
          background: var(--canvas);
        }

        body {
          padding: 64px 16px 40px;
          background: var(--canvas);
        }

        .screen-actions {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          z-index: 10;
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 48px;
          padding: 0 max(16px, calc((100vw - 210mm) / 2));
          border-bottom: 1px solid #d2d5d9;
          background: rgba(255, 255, 255, 0.96);
        }

        .screen-actions a {
          color: var(--ink);
          font-size: 13px;
          font-weight: 600;
        }

        .screen-actions .download {
          padding: 7px 12px;
          border-radius: 4px;
          background: var(--ink);
          color: #fff;
        }

        .sheet {
          min-height: 297mm;
          padding: 13mm 16mm;
          box-shadow: 0 8px 30px rgba(20, 25, 30, 0.16);
        }

        .page-break {
          break-before: auto;
          page-break-before: auto;
          margin: 12pt 0;
          border-top: 1px dashed #c6c9cc;
        }
      }

      @media print {
        html,
        body {
          padding: 0;
          margin: 0;
          background: #fff;
        }

        .screen-actions {
          display: none !important;
        }

        /* Let each tailored CV balance itself instead of forcing the old split. */
        .page-break {
          display: none;
        }

        /* Three-role CVs balance best with the final role starting page two. */
        .sheet h3:nth-of-type(3) {
          break-before: page;
          page-break-before: always;
        }

        .sheet {
          width: auto;
          max-width: none;
          min-height: 0;
          margin: 0;
          padding: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <nav class="screen-actions" aria-label="CV actions">
      <a href="index.html">← Back to site</a>
      <a
        class="download"
        href="cv.pdf"
        download="Prateek-Rajvats-CV.pdf"
        >Download PDF</a
      >
    </nav>

    <main class="sheet">
      <h1 class="name">$name$</h1>
      <p class="subtitle">$if(tagline)$$tagline$$else$$role$$endif$</p>
      <p class="contact">
        $location$ <span class="sep">•</span> $phone$
        <span class="sep">•</span>
        <a href="mailto:$email$">$email$</a><br />
        <a href="https://$linkedin$">$linkedin$</a>
        <span class="sep">•</span>
        <a href="https://$github$">$github$</a>
      </p>
      <hr class="rule-top" />
      $body$
    </main>

  </body>
</html>
